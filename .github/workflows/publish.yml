name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # PyPI Trusted Publishing (OIDC) — no API token needed
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The tag must match pyproject.toml, so a release can't publish the wrong version.
      - run: test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: pip install build pytest
      - run: python -m pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
