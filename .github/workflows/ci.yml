name: CI
on:
  push:
  pull_request:
  # Weekly on ubuntu-latest, so a runner or toolchain change fails on a quiet
  # Monday instead of on the next pull request.
  schedule:
    - cron: "17 6 * * 1"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
