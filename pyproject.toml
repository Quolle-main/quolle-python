[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quolle"
version = "1.2.0"
description = "Official Python SDK for the Quolle email API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Quolle" }]
keywords = ["quolle", "email", "transactional email", "smtp", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
dependencies = []

[project.urls]
Homepage = "https://quolle.com"
Documentation = "https://quolle.com/docs"
Source = "https://github.com/Quolle-main/quolle-python"
Issues = "https://github.com/Quolle-main/quolle-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quolle = ["py.typed"]
